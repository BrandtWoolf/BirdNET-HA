name: BirdNET-Go
version: "1.0.1"
slug: birdnet_go
description: >-
  Realtime soundscape analyser for birds, wildlife, and bats — self-hosted,
  24/7, local AI inference with a web dashboard and MQTT / Home Assistant
  discovery.
url: https://github.com/BrandtWoolf/BirdNET-HA/tree/main/birdnet-go
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8080
panel_icon: mdi:bird
panel_title: BirdNET-Go
panel_admin: false
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Optional direct access to the web interface (ingress is used by default)
map:
  - addon_config:rw
  - share:rw
  - media:rw
audio: true
services:
  - mqtt:want
